[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "edgen-foundry"
version = "0.1.0"
description = "EdGen Problem Foundry: verified problem generators, trust pipeline, pools"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
