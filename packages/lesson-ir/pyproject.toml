[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "edgen-lesson-ir"
version = "0.1.0"
description = "EdGen lesson intermediate representation, receipts, and renderers"
requires-python = ">=3.11"
dependencies = ["pydantic"]

[tool.setuptools.packages.find]
where = ["src"]
